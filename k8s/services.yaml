apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: nestjs
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nestjs
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: tcp
      port: 4002
      targetPort: 4002
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: nestjs
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: tcp
      port: 3001
      targetPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: nestjs
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: nestjs
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 3003
      targetPort: 3003
