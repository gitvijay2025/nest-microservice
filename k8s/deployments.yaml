apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nestjs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/YOUR_GITHUB_USERNAME/nestjs-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: nestjs-config
            - secretRef:
                name: nestjs-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nestjs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/YOUR_GITHUB_USERNAME/nestjs-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          env:
            - name: AUTH_SERVICE_HOST
              value: "0.0.0.0"
          envFrom:
            - configMapRef:
                name: nestjs-config
            - secretRef:
                name: nestjs-secret
---
